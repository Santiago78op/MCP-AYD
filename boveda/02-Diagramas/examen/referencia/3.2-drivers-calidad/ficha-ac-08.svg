<text x="252" y="445.61" font-size="13" fill="#1e1e1e" text-anchor="start">El sistema demuestra criptográficamente la integridad de la serie (hash encadenado o firma de sensores —</text>
<text x="252" y="461.86" font-size="13" fill="#1e1e1e" text-anchor="start">la técnica se decide en diseño; el driver fija la propiedad)</text>
