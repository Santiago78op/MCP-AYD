<line x1="870" y1="430" x2="1040" y2="430" stroke="#1e1e1e" stroke-width="1"/>
<line x1="1040" y1="430" x2="1040" y2="390" stroke="#1e1e1e" stroke-width="1"/>
<line x1="1040" y1="390" x2="1200" y2="390" stroke="#1e1e1e" stroke-width="1" marker-end="url(#flecha)"/>
<text x="1120.0" y="372.58" font-size="14" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">infracción presunta</text>
<line x1="870" y1="430" x2="1040" y2="430" stroke="#1e1e1e" stroke-width="1"/>
<line x1="1040" y1="430" x2="1040" y2="600" stroke="#1e1e1e" stroke-width="1"/>
<line x1="1040" y1="600" x2="1200" y2="600" stroke="#1e1e1e" stroke-width="1" marker-end="url(#flecha)"/>
<text x="1120.0" y="573.58" font-size="14" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">vencimiento ·</text>
<text x="1120.0" y="591.08" font-size="14" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">falla · alarma</text>
