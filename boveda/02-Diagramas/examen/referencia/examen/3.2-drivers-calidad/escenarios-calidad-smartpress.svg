<text x="132" y="413.61" font-size="13" fill="#1e1e1e" text-anchor="start">Turno de la noche</text>
<rect x="350" y="380" width="280" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="362" y="413.61" font-size="13" fill="#1e1e1e" text-anchor="start">El volumen de datos sube 10x</text>
