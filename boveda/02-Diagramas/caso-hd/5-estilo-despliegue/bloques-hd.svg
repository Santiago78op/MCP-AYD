<line x1="600" y1="430" x2="770" y2="430" stroke="#1e1e1e" stroke-width="1" marker-end="url(#flecha)"/>
<text x="520.0" y="583.64" font-size="12" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">material recibido</text>
