<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="gen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><polygon points="0,0 12,6 0,12" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/></marker><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1e1e1e"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="40" y="59.4" font-size="20" fill="#1e1e1e" text-anchor="start">Drivers de restricción — TÉCNICAS (tecnologías y plataformas)</text>
<text x="40" y="88.61" font-size="13" fill="#1e1e1e" text-anchor="start">Las restricciones NO se priorizan: todas son obligatorias, y ninguna lleva medida (se cumple o no se cumple).</text>
<text x="40" y="104.86" font-size="13" fill="#1e1e1e" text-anchor="start">Clasificadas en las TRES categorías que pide el enunciado — Técnicas, de Negocio y de Sistema —, no en las seis de clase. La última columna es la que las convierte en driver.</text>
<rect x="40" y="140" width="110" height="60" rx="0" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="173.61" font-size="13" fill="#1e1e1e" text-anchor="start">ID</text>
<rect x="150" y="140" width="640" height="60" rx="0" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="173.61" font-size="13" fill="#1e1e1e" text-anchor="start">Restricción</text>
<rect x="790" y="140" width="250" height="60" rx="0" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="173.61" font-size="13" fill="#1e1e1e" text-anchor="start">Origen</text>
<rect x="1040" y="140" width="520" height="60" rx="0" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="173.61" font-size="13" fill="#1e1e1e" text-anchor="start">Qué decisión bloquea</text>
<rect x="40" y="200" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="233.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T01</text>
<rect x="150" y="200" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="233.61" font-size="13" fill="#1e1e1e" text-anchor="start">El protocolo con las máquinas debe ser OPC-UA; no se puede sustituir</text>
<rect x="790" y="200" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="233.61" font-size="13" fill="#1e1e1e" text-anchor="start">Junta Directiva</text>
<rect x="1040" y="200" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="233.61" font-size="13" fill="#1e1e1e" text-anchor="start">Descarta cualquier protocolo propio o más liviano para el lazo de control</text>
<rect x="40" y="260" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="293.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T02</text>
<rect x="150" y="260" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="293.61" font-size="13" fill="#1e1e1e" text-anchor="start">25 PLC Siemens S7-1500, 500 mediciones/s cada uno</text>
<rect x="790" y="260" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="293.61" font-size="13" fill="#1e1e1e" text-anchor="start">Infraestructura de planta</text>
<rect x="1040" y="260" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="293.61" font-size="13" fill="#1e1e1e" text-anchor="start">Fija el caudal de ingesta: 12,500 mediciones/s en régimen normal</text>
<rect x="40" y="320" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="353.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T03</text>
<rect x="150" y="320" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="353.61" font-size="13" fill="#1e1e1e" text-anchor="start">Red industrial Ethernet/IP, 5 ms de latencia, con caídas esporádicas</text>
<rect x="790" y="320" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="353.61" font-size="13" fill="#1e1e1e" text-anchor="start">Infraestructura de planta</text>
<rect x="1040" y="320" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="353.61" font-size="13" fill="#1e1e1e" text-anchor="start">Prohíbe asumir red confiable: obliga a buffer local (AC-03)</text>
<rect x="40" y="380" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="413.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T04</text>
<rect x="150" y="380" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="405.61" font-size="13" fill="#1e1e1e" text-anchor="start">Internet de 100 Mbps compartido; no se puede depender únicamente de la nube para tiempo</text>
<text x="162" y="421.86" font-size="13" fill="#1e1e1e" text-anchor="start">real</text>
<rect x="790" y="380" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="413.61" font-size="13" fill="#1e1e1e" text-anchor="start">Infraestructura / Junta</text>
<rect x="1040" y="380" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="413.61" font-size="13" fill="#1e1e1e" text-anchor="start">Descarta la inferencia en la nube; obliga a cómputo en el borde</text>
<rect x="40" y="440" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="473.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T05</text>
<rect x="150" y="440" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="473.61" font-size="13" fill="#1e1e1e" text-anchor="start">Data center local: 4 servidores VMware, 64 vCPU, 256 GB RAM, 20 TB SAN</text>
<rect x="790" y="440" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="473.61" font-size="13" fill="#1e1e1e" text-anchor="start">Infraestructura</text>
<rect x="1040" y="440" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="465.61" font-size="13" fill="#1e1e1e" text-anchor="start">20 TB se agotan en 4 días de datos crudos: descarta guardar todo</text>
<text x="1052" y="481.86" font-size="13" fill="#1e1e1e" text-anchor="start">on-premise</text>
<rect x="40" y="500" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="533.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T06</text>
<rect x="150" y="500" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="533.61" font-size="13" fill="#1e1e1e" text-anchor="start">No se pueden almacenar todos los datos crudos de sensores en la base transaccional</text>
<rect x="790" y="500" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="533.61" font-size="13" fill="#1e1e1e" text-anchor="start">Junta Directiva</text>
<rect x="1040" y="500" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="533.61" font-size="13" fill="#1e1e1e" text-anchor="start">PROHIBE de frente la tabla única SensorReadings de la Parte III</text>
<rect x="40" y="560" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="593.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T07</text>
<rect x="150" y="560" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="593.61" font-size="13" fill="#1e1e1e" text-anchor="start">La base de datos debe soportar particionamiento y retención de datos</text>
<rect x="790" y="560" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="593.61" font-size="13" fill="#1e1e1e" text-anchor="start">Junta Directiva</text>
<rect x="1040" y="560" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="593.61" font-size="13" fill="#1e1e1e" text-anchor="start">Descarta una tabla plana sin estrategia de partición</text>
<rect x="40" y="620" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="653.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T08</text>
<rect x="150" y="620" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="653.61" font-size="13" fill="#1e1e1e" text-anchor="start">No se puede diseñar un sistema monolítico: ingesta, ML y trazabilidad escalan distinto</text>
<rect x="790" y="620" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="653.61" font-size="13" fill="#1e1e1e" text-anchor="start">Junta Directiva</text>
<rect x="1040" y="620" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="653.61" font-size="13" fill="#1e1e1e" text-anchor="start">Obliga a servicios desplegables por separado (y tensiona con AC-07)</text>
<rect x="40" y="680" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="713.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T09</text>
<rect x="150" y="680" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="713.61" font-size="13" fill="#1e1e1e" text-anchor="start">Los datos de producción deben viajar cifrados; nada en texto plano por la red</text>
<rect x="790" y="680" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="713.61" font-size="13" fill="#1e1e1e" text-anchor="start">Política de seguridad</text>
<rect x="1040" y="680" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="713.61" font-size="13" fill="#1e1e1e" text-anchor="start">Obliga a TLS en todo canal, incluido el de comandos</text>
<rect x="40" y="740" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="773.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T10</text>
<rect x="150" y="740" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="773.61" font-size="13" fill="#1e1e1e" text-anchor="start">A la nube solo pueden salir análisis agregados; los datos crudos no salen de la planta</text>
<rect x="790" y="740" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="773.61" font-size="13" fill="#1e1e1e" text-anchor="start">Política de seguridad</text>
<rect x="1040" y="740" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="773.61" font-size="13" fill="#1e1e1e" text-anchor="start">Define qué capa puede externalizarse: la tibia, nunca la cruda</text>
<rect x="40" y="800" width="110" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="833.61" font-size="13" fill="#1e1e1e" text-anchor="start">RES-T11</text>
<rect x="150" y="800" width="640" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="162" y="833.61" font-size="13" fill="#1e1e1e" text-anchor="start">Stack del equipo: .NET, SQL Server, Azure, Angular; ML en Python/TensorFlow/Scikit-learn</text>
<rect x="790" y="800" width="250" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="802" y="833.61" font-size="13" fill="#1e1e1e" text-anchor="start">Equipo y habilidades</text>
<rect x="1040" y="800" width="520" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1052" y="833.61" font-size="13" fill="#1e1e1e" text-anchor="start">Acota las tecnologías elegibles a lo que 4 personas pueden operar</text>
</svg>