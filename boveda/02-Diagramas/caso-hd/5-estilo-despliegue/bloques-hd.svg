<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 1640 1040" width="1640" height="1040" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="gen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><polygon points="0,0 12,6 0,12" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/></marker><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1e1e1e"/></marker></defs>
<rect x="0" y="-30" width="1640" height="1040" fill="#ffffff"/>
<text x="40" y="29.4" font-size="20" fill="#1e1e1e" text-anchor="start">Diagrama de bloques: SiL'K, arquitectura basada en eventos</text>
<text x="40" y="56.61" font-size="13" fill="#1e1e1e" text-anchor="start">Los productores publican eventos sin conocer a los consumidores: el enrutador los filtra y los entrega. Cada flecha lleva el nombre del evento.</text>
<rect x="40" y="100" width="400" height="870" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="240.0" y="105.55" font-size="15" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Productores de eventos</text>
<svg x="208" y="140" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2" /> <line x1="8" x2="16" y1="21" y2="21" /> <line x1="12" x2="12" y1="17" y2="21" /></svg>
<text x="240.0" y="226.55" font-size="15" fill="#1e1e1e" text-anchor="middle">Aplicación web SiL'K</text>
<text x="240.0" y="247.64" font-size="12" fill="#1e1e1e" text-anchor="middle">Un empleado solicita y un comprador</text>
<text x="240.0" y="262.64" font-size="12" fill="#1e1e1e" text-anchor="middle">emite o sigue un pedido de compra</text>
<svg x="208" y="350" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /> <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /> <path d="M2 12h20" /></svg>
<text x="240.0" y="436.55" font-size="15" fill="#1e1e1e" text-anchor="middle">Portal del suministrador</text>
<text x="240.0" y="457.64" font-size="12" fill="#1e1e1e" text-anchor="middle">El suministrador confirma el pedido,</text>
<text x="240.0" y="472.64" font-size="12" fill="#1e1e1e" text-anchor="middle">avisa el envío o presenta su factura</text>
<svg x="208" y="560" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect width="10" height="14" x="3" y="8" rx="2" /> <path d="M5 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-2.4" /> <path d="M8 18h.01" /></svg>
<text x="240.0" y="646.55" font-size="15" fill="#1e1e1e" text-anchor="middle">App de recepción</text>
<text x="240.0" y="667.64" font-size="12" fill="#1e1e1e" text-anchor="middle">El almacén registra en el muelle</text>
<text x="240.0" y="682.64" font-size="12" fill="#1e1e1e" text-anchor="middle">el material recibido</text>
<svg x="208" y="770" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" /> <path d="M17 18h1" /> <path d="M12 18h1" /> <path d="M7 18h1" /></svg>
<text x="240.0" y="856.55" font-size="15" fill="#1e1e1e" text-anchor="middle">MRP/DRP de planta</text>
<text x="240.0" y="877.64" font-size="12" fill="#1e1e1e" text-anchor="middle">Cada centro de producción publica</text>
<text x="240.0" y="892.64" font-size="12" fill="#1e1e1e" text-anchor="middle">sus requisitos de material</text>
<rect x="1200" y="100" width="400" height="870" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1400.0" y="105.55" font-size="15" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Consumidores de eventos</text>
<svg x="1368" y="140" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /> <path d="M3 5V19A9 3 0 0 0 21 19V5" /> <path d="M3 12A9 3 0 0 0 21 12" /></svg>
<text x="1400.0" y="226.55" font-size="15" fill="#1e1e1e" text-anchor="middle">Base de datos de compras</text>
<text x="1400.0" y="247.64" font-size="12" fill="#1e1e1e" text-anchor="middle">Los eventos actualizan pedidos, recepciones</text>
<text x="1400.0" y="262.64" font-size="12" fill="#1e1e1e" text-anchor="middle">y el registro de suministradores</text>
<svg x="1368" y="350" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="12" x="2" y="6" rx="2" /> <circle cx="12" cy="12" r="2" /> <path d="M6 12h.01M18 12h.01" /></svg>
<text x="1400.0" y="436.55" font-size="15" fill="#1e1e1e" text-anchor="middle">Cuentas de Acreedores</text>
<text x="1400.0" y="457.64" font-size="12" fill="#1e1e1e" text-anchor="middle">Los eventos desencadenan el pago</text>
<text x="1400.0" y="472.64" font-size="12" fill="#1e1e1e" text-anchor="middle">de las facturas conciliadas</text>
<svg x="1368" y="560" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" /> <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>
<text x="1400.0" y="646.55" font-size="15" fill="#1e1e1e" text-anchor="middle">Suministrador</text>
<text x="1400.0" y="667.64" font-size="12" fill="#1e1e1e" text-anchor="middle">Los eventos le notifican pedidos nuevos</text>
<text x="1400.0" y="682.64" font-size="12" fill="#1e1e1e" text-anchor="middle">y reclamos de plazo</text>
<svg x="1368" y="770" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16" /> <path d="M18 17V9" /> <path d="M13 17V5" /> <path d="M8 17v-3" /></svg>
<text x="1400.0" y="856.55" font-size="15" fill="#1e1e1e" text-anchor="middle">Almacén analítico</text>
<text x="1400.0" y="877.64" font-size="12" fill="#1e1e1e" text-anchor="middle">Los eventos alimentan el gasto consolidado</text>
<text x="1400.0" y="892.64" font-size="12" fill="#1e1e1e" text-anchor="middle">y los indicadores de calidad, coste y plazo</text>
<svg x="780" y="390" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" /></svg>
<text x="820.0" y="494.55" font-size="15" fill="#1e1e1e" text-anchor="middle">Enrutador de eventos</text>
<text x="820.0" y="515.64" font-size="12" fill="#1e1e1e" text-anchor="middle">El bus de eventos recibe, filtra</text>
<text x="820.0" y="530.64" font-size="12" fill="#1e1e1e" text-anchor="middle">y empuja los eventos a los</text>
<text x="820.0" y="545.64" font-size="12" fill="#1e1e1e" text-anchor="middle">consumidores apropiados</text>
