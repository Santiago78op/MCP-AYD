<text x="252" y="333.61" font-size="13" fill="#1e1e1e" text-anchor="start">El registro de lecturas de los sensores IoT</text>
<rect x="40" y="360" width="200" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
