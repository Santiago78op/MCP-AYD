<rect x="0" y="0" width="1020" height="580" fill="#ffffff"/>
<text x="40" y="59.4" font-size="20" fill="#1e1e1e" text-anchor="start">AC-01 — Eficiencia (comportamiento temporal)</text>
<text x="40" y="86.61" font-size="13" fill="#1e1e1e" text-anchor="start">Secundario: fiabilidad  ·  Origen: acuerdo de calidad 1 + escenario crítico 3</text>
