<rect x="0" y="0" width="1500" height="1080" fill="#ffffff"/>
<text x="40" y="59.4" font-size="20" fill="#1e1e1e" text-anchor="start">Drivers de Requisitos Funcionales — SmartPress</text>
<text x="40" y="88.61" font-size="13" fill="#1e1e1e" text-anchor="start">«Funcionalidades específicas que MOLDEAN la estructura». Se entregan como CDU expandidos: los de CUN-03 y CUN-05 están dibujados (3.1-drivers-rf);</text>
<text x="40" y="104.86" font-size="13" fill="#1e1e1e" text-anchor="start">los de CUN-01, CUN-02 y CUN-04 quedan sin expandir porque el enunciado pide solamente 2 CUN.</text>
