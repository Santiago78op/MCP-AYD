<text x="252" y="213.61" font-size="13" fill="#1e1e1e" text-anchor="start">El enfermero de piso, desde la Toughpad junto a la cama</text>
<rect x="40" y="240" width="200" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
