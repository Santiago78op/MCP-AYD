<rect x="1090" y="440" width="300" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1102" y="465.61" font-size="13" fill="#1e1e1e" text-anchor="start">Solo se ejecutan órdenes firmadas y</text>
<text x="1102" y="481.86" font-size="13" fill="#1e1e1e" text-anchor="start">autenticadas</text>
