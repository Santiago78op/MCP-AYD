<text x="252" y="393.61" font-size="13" fill="#1e1e1e" text-anchor="start">Operación normal de red; y condición degradada (Wi-Fi inestable del piso)</text>
<rect x="40" y="420" width="200" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
