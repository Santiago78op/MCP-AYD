<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 720" width="1780" height="720" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="gen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><polygon points="0,0 12,6 0,12" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/></marker><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1e1e1e"/></marker></defs>
<rect x="0" y="0" width="1780" height="720" fill="#ffffff"/>
<text x="40" y="59.4" font-size="20" fill="#1e1e1e" text-anchor="start">Drivers de calidad — escenarios de SEIS partes</text>
<text x="40" y="88.61" font-size="13" fill="#1e1e1e" text-anchor="start">Fuente · Estímulo · Artefacto · Entorno · Respuesta · MEDIDA. La última columna va sombreada: es la que convierte el deseo en driver.</text>
<text x="40" y="104.86" font-size="13" fill="#1e1e1e" text-anchor="start">Un atributo de calidad NO es un caso de uso; no se dibuja como elipse, se especifica como escenario.</text>
<rect x="40" y="140" width="80" height="60" rx="0" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="173.61" font-size="13" fill="#1e1e1e" text-anchor="start">ID</text>
<rect x="120" y="140" width="230" height="60" rx="0" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1"/>
