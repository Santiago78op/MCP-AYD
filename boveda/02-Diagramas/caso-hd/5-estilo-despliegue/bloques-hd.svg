<line x1="600" y1="180" x2="600" y2="430" stroke="#1e1e1e" stroke-width="1"/>
<line x1="600" y1="430" x2="770" y2="430" stroke="#1e1e1e" stroke-width="1" marker-end="url(#flecha)"/>
<text x="520.0" y="156.64" font-size="12" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">solicitud aprobada /</text>
<text x="520.0" y="171.64" font-size="12" fill="#1e1e1e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">pedido emitido</text>
