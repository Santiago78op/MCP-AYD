<text x="1402" y="361.86" font-size="13" fill="#1e1e1e" text-anchor="start">trazables; 0 cortes visibles</text>
<rect x="40" y="380" width="80" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
