<rect x="240" y="420" width="740" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="252" y="453.61" font-size="13" fill="#1e1e1e" text-anchor="start">Confirma la correspondencia o dispara la alerta roja de discrepancia</text>
