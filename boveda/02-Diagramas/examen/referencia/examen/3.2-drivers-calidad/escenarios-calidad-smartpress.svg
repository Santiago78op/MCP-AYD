<text x="1102" y="173.61" font-size="13" fill="#1e1e1e" text-anchor="start">Respuesta</text>
<rect x="1390" y="140" width="330" height="60" rx="0" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1"/>
<text x="1402" y="173.61" font-size="13" fill="#1e1e1e" text-anchor="start">MEDIDA</text>
<rect x="40" y="200" width="80" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="233.61" font-size="13" fill="#1e1e1e" text-anchor="start">AC-01</text>
<rect x="120" y="200" width="230" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="132" y="233.61" font-size="13" fill="#1e1e1e" text-anchor="start">Sensores de la máquina</text>
<rect x="350" y="200" width="280" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="362" y="225.61" font-size="13" fill="#1e1e1e" text-anchor="start">Se completan las 500 mediciones de un</text>
<text x="362" y="241.86" font-size="13" fill="#1e1e1e" text-anchor="start">ciclo</text>
<rect x="630" y="200" width="240" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="642" y="233.61" font-size="13" fill="#1e1e1e" text-anchor="start">Motor de inferencia ML</text>
<rect x="870" y="200" width="220" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="882" y="225.61" font-size="13" fill="#1e1e1e" text-anchor="start">Producción normal, 25</text>
<text x="882" y="241.86" font-size="13" fill="#1e1e1e" text-anchor="start">máquinas</text>
<rect x="1090" y="200" width="300" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1102" y="225.61" font-size="13" fill="#1e1e1e" text-anchor="start">Emite la predicción de calidad de la</text>
<text x="1102" y="241.86" font-size="13" fill="#1e1e1e" text-anchor="start">pieza</text>
<rect x="1390" y="200" width="330" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1402" y="233.61" font-size="13" fill="#1e1e1e" text-anchor="start">&lt; 1 s (ciclo 45 s) / &lt; 5 s (ciclo 120 s)</text>
<rect x="40" y="260" width="80" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="293.61" font-size="13" fill="#1e1e1e" text-anchor="start">AC-02</text>
<rect x="120" y="260" width="230" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="132" y="293.61" font-size="13" fill="#1e1e1e" text-anchor="start">PLC Siemens S7-1500</text>
<rect x="350" y="260" width="280" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="362" y="285.61" font-size="13" fill="#1e1e1e" text-anchor="start">Envía una solicitud de ajuste vía</text>
<text x="362" y="301.86" font-size="13" fill="#1e1e1e" text-anchor="start">OPC-UA</text>
<rect x="630" y="260" width="240" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="642" y="293.61" font-size="13" fill="#1e1e1e" text-anchor="start">Servicio de control</text>
<rect x="870" y="260" width="220" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="882" y="285.61" font-size="13" fill="#1e1e1e" text-anchor="start">Red industrial Ethernet/IP,</text>
<text x="882" y="301.86" font-size="13" fill="#1e1e1e" text-anchor="start">5 ms</text>
<rect x="1090" y="260" width="300" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1102" y="293.61" font-size="13" fill="#1e1e1e" text-anchor="start">Responde con la orden de ajuste</text>
<rect x="1390" y="260" width="330" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1402" y="293.61" font-size="13" fill="#1e1e1e" text-anchor="start">&lt; 200 ms extremo a extremo</text>
<rect x="40" y="320" width="80" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="52" y="353.61" font-size="13" fill="#1e1e1e" text-anchor="start">AC-03</text>
<rect x="120" y="320" width="230" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="132" y="353.61" font-size="13" fill="#1e1e1e" text-anchor="start">Red industrial</text>
<rect x="350" y="320" width="280" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="362" y="353.61" font-size="13" fill="#1e1e1e" text-anchor="start">Caída de red de 30 s</text>
<rect x="630" y="320" width="240" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="642" y="353.61" font-size="13" fill="#1e1e1e" text-anchor="start">Ingesta + buffer local</text>
<rect x="870" y="320" width="220" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="882" y="353.61" font-size="13" fill="#1e1e1e" text-anchor="start">Planta 24/7, 3 turnos</text>
<rect x="1090" y="320" width="300" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1102" y="345.61" font-size="13" fill="#1e1e1e" text-anchor="start">Conserva el buffer, reconstruye la</text>
<text x="1102" y="361.86" font-size="13" fill="#1e1e1e" text-anchor="start">trazabilidad y sigue operando</text>
