<text x="642" y="421.86" font-size="13" fill="#1e1e1e" text-anchor="start">almacenamiento</text>
<rect x="870" y="380" width="220" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="882" y="405.61" font-size="13" fill="#1e1e1e" text-anchor="start">Presupuesto de</text>
<text x="882" y="421.86" font-size="13" fill="#1e1e1e" text-anchor="start">infraestructura fijo</text>
<rect x="1090" y="380" width="300" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="1102" y="413.61" font-size="13" fill="#1e1e1e" text-anchor="start">Absorbe el pico sin degradar el servicio</text>
<rect x="1390" y="380" width="330" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
