<text x="52" y="513.61" font-size="13" fill="#1e1e1e" text-anchor="start">MEDIDA</text>
<rect x="240" y="480" width="740" height="60" rx="0" fill="#f5f5f5" stroke="#1e1e1e" stroke-width="1"/>
<text x="252" y="505.61" font-size="13" fill="#1e1e1e" text-anchor="start">&lt; 500 ms (p95) en red normal y &lt; 2 s en degradada, con 15.000 pacientes y 800 SKUs en base — la alerta de</text>
<text x="252" y="521.86" font-size="13" fill="#1e1e1e" text-anchor="start">4 s del escenario 3 es el contraejemplo</text>
