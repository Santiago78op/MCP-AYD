<text x="252" y="273.61" font-size="13" fill="#1e1e1e" text-anchor="start">Escanea la pulsera del paciente y el código del medicamento para validar</text>
<rect x="40" y="300" width="200" height="60" rx="0" fill="none" stroke="#1e1e1e" stroke-width="1"/>
